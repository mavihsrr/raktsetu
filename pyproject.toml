[project]
name = "raktsetu"
version = "0.1.0"
description = "Voice-first, verified blood search for hospital blood-centre coordinators."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "flagsmith>=6.0,<7",
  "python-dotenv>=1.0",
  "prometheus-client>=0.20",
]

[project.optional-dependencies]
voice = ["sarvam-conv-ai-sdk[all]>=1.1"]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
