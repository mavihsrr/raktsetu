# RaktSetu on GKE Autopilot.
# Secrets are NOT in this file: `raktsetu-env` (from .env) and `ngrok` (authtoken) are created by deploy/deploy.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: raktsetu
---
# SQLite lives here, so requests survive pod restarts (the coordinator resumes them on startup).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: raktsetu-data
  namespace: raktsetu
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: raktsetu
  namespace: raktsetu
  labels: {app: raktsetu}
spec:
  replicas: 1                 # SQLite + in-process call state: exactly one writer
  strategy:
    type: Recreate            # never two pods on the same volume / dialling at once
  selector:
    matchLabels: {app: raktsetu}
  template:
    metadata:
      labels: {app: raktsetu}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      terminationGracePeriodSeconds: 20
      containers:
        - name: app
          image: IMAGE_PLACEHOLDER
          ports: [{containerPort: 8000, name: http}]
          envFrom:
            - secretRef: {name: raktsetu-env}
          env:
            - {name: DB_PATH, value: /data/raktsetu.db}
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 512Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: raktsetu-data}
---
apiVersion: v1
kind: Service
metadata:
  name: raktsetu
  namespace: raktsetu
spec:
  selector: {app: raktsetu}
  ports: [{name: http, port: 8000, targetPort: http}]
---
# Public entry: the same static ngrok domain the Sarvam tools already point at.
# Only ONE ngrok agent may serve the domain: stop the laptop's ngrok before this runs.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ngrok
  namespace: raktsetu
  labels: {app: ngrok}
spec:
  replicas: NGROK_REPLICAS_PLACEHOLDER   # set by deploy.sh (NGROK_REPLICAS, default 1)
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: ngrok}
  template:
    metadata:
      labels: {app: ngrok}
    spec:
      containers:
        - name: ngrok
          image: ngrok/ngrok:3
          args: ["http", "--url=https://NGROK_DOMAIN_PLACEHOLDER", "http://raktsetu.raktsetu.svc.cluster.local:8000", "--log=stdout"]
          env:
            - name: NGROK_AUTHTOKEN
              valueFrom: {secretKeyRef: {name: ngrok, key: authtoken}}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 512Mi}
